version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./dataset:/app/dataset
      - ./storage:/app/storage
      - ./output:/app/output
    environment:
      - ENTITYMATCH_HOST=0.0.0.0
      - ENTITYMATCH_PORT=8000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
